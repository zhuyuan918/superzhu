        <h2>早期生活</h2>
        <p>朱元璋（1328年10月21日－1398年6月24日），名元璋，字国瑞，出生于濠州钟离（今安徽凤阳）。他是明朝的开国皇帝，庙号太祖。</p>
        <p>早年家境贫寒，曾为僧，在寺庙和乡村之间流浪。</p>
    </div>
    <div class="content">
        <h2>起义与建立明朝</h2>
        <p>1352年，朱元璋加入了红巾军反抗元朝统治，并逐渐崭露头角。他通过一系列军事行动，最终于1368年建立了明朝，定都南京。</p>
    </div>
    <div class="content">
        <h2>统治时期</h2>
        <p>作为皇帝，朱元璋实施了一系列改革措施，包括土地重新分配、整顿官僚体系等，致力于恢复和发展经济。</p>
